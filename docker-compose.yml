services:
  # 1. Redis
  redis:
    image: redis/redis-stack-server:latest
    container_name: fish-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - fish-net

  # 2. 后端 FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fish-backend
    volumes:
      - ./:/app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/docs" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - fish-net

  # 3. 前端 Streamlit
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fish-frontend
    volumes:
      - ./:/app
    command: streamlit run ui.py --server.port 8501 --server.address 0.0.0.0 --server.fileWatcherType none --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false
    ports:
      - "${FRONTEND_PORT:-18501}:8501"
    environment:
      - API_BASE_URL=http://backend:8000
      - STREAMLIT_SERVER_RUN_ON_SAVE=false
    env_file:
      - .env
    depends_on:
      - backend
    restart: always
    networks:
      - fish-net

  # 4. Celery 异步任务
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fish-worker
    command: python -m celery -A core.RAG.celery_app.celery_app worker --loglevel=info
    environment:
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
      - DB_URL=sqlite:////app/dev.db
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./:/app
      - ./uploads:/app/uploads
    restart: always
    networks:
      - fish-net
networks:
  fish-net:
    driver: bridge

volumes:
  redis_data: